[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "context-engine"
version = "0.1.0"
description = "Local-first semantic code intelligence with SCIP-backed framework semantics"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "RecargaPay"}]
keywords = ["scip", "mcp", "code-intelligence", "spring", "reactor", "netty"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/rp-arielrodriguez/context-engine"
Repository = "https://github.com/rp-arielrodriguez/context-engine"
Issues = "https://github.com/rp-arielrodriguez/context-engine/issues"

[project.scripts]
context-engine = "context_engine.surfaces.cli.main:main"
context-engine-mcp = "context_engine.surfaces.mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=8.0,<9"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
context_engine = ["adapters/scip/*.java"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

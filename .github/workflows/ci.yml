name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: python -m pip install -e '.[dev]'

      - name: Run tests
        run: pytest

      - name: Run optional real-index integration tests
        if: ${{ env.CONTEXT_ENGINE_TEST_INDEX != '' }}
        run: pytest tests/test_integration_real_index.py
